<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Ads measurement signal flow</title>
  <desc id="desc">An abstract event funnel connecting website interactions to measured signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#24384a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="770" cy="118" r="190" fill="#25f4ee" opacity=".06"/>
  <circle cx="160" cy="520" r="240" fill="#fe2c55" opacity=".07"/>
  <g fill="none" stroke="#dbe7ef" stroke-width="3" opacity=".55">
    <path d="M150 155H350L430 235H620"/>
    <path d="M150 300H390L470 300H690"/>
    <path d="M150 445H350L430 365H620"/>
  </g>
  <g fill="#172434" stroke="#dbe7ef" stroke-width="3">
    <rect x="94" y="110" width="118" height="90" rx="22"/><rect x="94" y="255" width="118" height="90" rx="22"/><rect x="94" y="400" width="118" height="90" rx="22"/>
  </g>
  <g fill="url(#flow)" filter="url(#glow)">
    <circle cx="153" cy="155" r="16"/><circle cx="153" cy="300" r="16"/><circle cx="153" cy="445" r="16"/>
  </g>
  <path d="M382 190H710L635 300 710 410H382L458 300Z" fill="#dbe7ef" opacity=".09" stroke="url(#flow)" stroke-width="5"/>
  <g fill="#f8fbfd" font-family="Inter, Arial, sans-serif">
    <text x="96" y="70" font-size="28" font-weight="700" letter-spacing="2">PIXEL SIGNAL FLOW</text>
    <text x="128" y="160" font-size="18" font-weight="700">VIEW</text><text x="128" y="305" font-size="18" font-weight="700">CART</text><text x="113" y="450" font-size="18" font-weight="700">ORDER</text>
    <text x="467" y="308" font-size="26" font-weight="700">MATCH</text>
    <text x="755" y="278" font-size="52" font-weight="700" fill="#25f4ee">+3.2%</text>
    <text x="758" y="318" font-size="18" fill="#c1d0db">identity signals</text>
  </g>
  <g fill="#fe2c55"><circle cx="726" cy="190" r="8"/><circle cx="748" cy="410" r="8"/></g>
</svg>
